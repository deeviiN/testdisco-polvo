name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vitest:
    name: Vitest (${{ matrix.runtime }}${{ matrix.runtime == 'node' && format(' {0}', matrix.node-version) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: bun
          - runtime: node
            node-version: '20'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache Bun global store
        if: matrix.runtime == 'bun'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache npm store
        if: matrix.runtime == 'node'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ matrix.runtime }}${{ matrix.node-version }}-node-modules-${{ hashFiles('bun.lockb', 'bun.lock', 'package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.runtime }}${{ matrix.node-version }}-node-modules-

      - name: Install dependencies (Bun)
        if: matrix.runtime == 'bun' && steps.node-modules-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Install dependencies (Node)
        if: matrix.runtime == 'node' && steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund

      - name: Run full vitest suite (Bun)
        if: matrix.runtime == 'bun'
        run: bunx vitest run --reporter=verbose

      - name: Run full vitest suite (Node)
        if: matrix.runtime == 'node'
        run: npx vitest run --reporter=verbose
