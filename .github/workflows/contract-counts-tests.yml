name: Contract Pending Counts SQL Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sql-tests:
    name: get_contract_pending_counts classification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U postgres && break
            sleep 2
          done

      - name: Run get_contract_pending_counts test suite
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/get_contract_pending_counts.test.sql
