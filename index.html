    <script>
      // Limpa Service Workers e caches travados no preview/dev antes de carregar o app
      (function () {
        const hostname = location.hostname;
        const isPreview =
          hostname.includes("preview") ||
          hostname.includes("lovableproject") ||
          hostname === "localhost" ||
          hostname === "127.0.0.1";
        if (!isPreview) return;

        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
        }
        if ("caches" in window) {
          caches.keys().then(function (names) {
            names.forEach(function (name) {
              caches.delete(name);
            });
          });
        }
      })();
    </script>

    <style>
      /* Instant splash screen - shown before JS loads */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #f7f8fa;
        font-family: system-ui, -apple-system, sans-serif;
        transition: opacity 0.3s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .logo { display: none; }
      #splash .name {
        font-size: 22px;
        font-weight: 700;
        color: #1a1a2e;
        background-image: linear-gradient(
          90deg,
          #1a1a2e 0%,
          #1a1a2e 40%,
          #ffffff 50%,
          #1a1a2e 60%,
          #1a1a2e 100%
        );
        background-size: 200% 100%;
        background-repeat: no-repeat;
        background-position: 200% 0;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: spotlight 2.5s ease-in-out infinite;
        filter: drop-shadow(0 0 0 transparent);
      }
      @keyframes spotlight {
        0% { background-position: 200% 0; filter: drop-shadow(0 0 0 transparent); }
        50% { filter: drop-shadow(0 0 6px rgba(255,255,255,0.9)); }
        100% { background-position: -100% 0; filter: drop-shadow(0 0 0 transparent); }
      }
      #splash .bar { width: 48px; height: 4px; border-radius: 2px; background: #e0e0e0; margin-top: 24px; overflow: hidden; }
      #splash .bar::after { content: ''; display: block; width: 100%; height: 100%; background: #6c3cfc; border-radius: 2px; animation: load 1s ease infinite; }
      @keyframes load { 0%{transform:translateX(-100%)} 50%{transform:translateX(0)} 100%{transform:translateX(100%)} }
    </style>

    <script>
      // Reload once when a new service worker takes control
      (function() {
        if ('serviceWorker' in navigator) {
          var refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        }
      })();
    </script>
